<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 배포 실습</title>

  <style>
    /* 페이지 전체 기본 설정 */
    body {
      margin: 0;
      height: 100vh;

      /* 내용을 화면 정중앙에 배치 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      font-family: sans-serif;
      background-color: #f5f5f5;
      color: #222222;
      text-align: center;
    }

    /* 큰 제목 */
    h1 {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* 설명 문구 */
    .description {
      font-size: 20px;
      color: #555555;
    }

    /* 버전 표시 */
    .version {
      margin-top: 40px;
      font-size: 16px;
      color: #888888;
    }
  </style>
</head>
<body>

  <h1>Claude Code 배포 실습</h1>

  <p class="description">첫 번째 배포에 성공했습니다.</p>

  <p class="version">Version 1</p>

</body>
</html>
